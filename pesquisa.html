<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesquisa Eleitoral 2026</title>
<style>
:root{--p:#1a5fb4;--pd:#104a8e;--s:#26a269;--bg:#f6f8fc;--card:#fff;--t:#1c1c1c;--tl:#5e5e5e;--b:#e2e8f0;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t);line-height:1.6;padding:16px}
.container{max-width:800px;margin:0 auto;background:var(--card);border-radius:var(--r);box-shadow:0 4px 20px rgba(0,0,0,0.08);overflow:hidden;animation:up .5s ease}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
header{background:linear-gradient(135deg,var(--p) 0%,var(--pd) 100%);color:#fff;padding:28px 20px;text-align:center}
header h1{font-size:1.4rem;font-weight:700;margin-bottom:4px}
header p{opacity:.9;font-size:.88rem}
.badge{display:inline-flex;align-items:center;gap:5px;background:#dcfce7;color:#166534;padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:600;margin-top:10px}
.body{padding:20px}
.passo-titulo{text-align:center;font-size:1.1rem;font-weight:600;margin-bottom:16px;color:var(--t)}
.ufs{display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:6px;margin-bottom:20px}
.uf-btn{padding:10px 6px;border:2px solid var(--b);background:#fff;border-radius:8px;cursor:pointer;font-weight:600;font-size:.82rem;transition:all .2s;line-height:1.3}
.uf-btn:hover{border-color:var(--p);background:#f0f7ff}
.uf-btn.ativo{border-color:var(--p);background:var(--p);color:#fff;box-shadow:0 3px 10px rgba(26,95,180,.25)}
.uf-btn .uf-nome{font-size:.68rem;font-weight:400;display:block;margin-top:2px}
.bloco{margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--b)}
.bloco:last-child{border:none;margin:0;padding:0}
.titulo{font-size:1rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.num{background:var(--p);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.opcoes{display:flex;flex-direction:column;gap:7px}
.op-radio{display:flex;align-items:center;padding:11px 14px;border:2px solid var(--b);border-radius:10px;background:#fff;cursor:pointer;transition:all .2s;gap:10px}
.op-radio:hover{border-color:var(--p);background:#f0f7ff}
.op-radio input[type="radio"]{width:18px;height:18px;accent-color:var(--p);flex-shrink:0;cursor:pointer}
.op-radio:has(input[type="radio"]:checked){border-color:var(--p);background:#e8f0fe;box-shadow:0 0 0 3px rgba(26,95,180,.1)}
.op-radio:has(input[type="radio"]:checked) .op-nome{color:var(--p)}
.op-check{display:flex;align-items:center;padding:11px 14px;border:2px solid var(--b);border-radius:10px;background:#fff;cursor:pointer;transition:all .2s;gap:10px}
.op-check:hover{border-color:var(--s);background:#f0fdf4}
.op-check input[type="checkbox"]{width:18px;height:18px;accent-color:var(--s);flex-shrink:0;cursor:pointer}
.op-check:has(input[type="checkbox"]:checked){border-color:var(--s);background:#dcfce7;box-shadow:0 0 0 3px rgba(38,162,105,.1)}
.op-nome{font-size:.9rem;font-weight:500}
.op-info{font-size:.72rem;color:var(--tl);margin-top:1px}
.op-check.desabilitado{opacity:.45;pointer-events:none}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--s) 0%,#1c7a4e 100%);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(38,162,105,.3)}
.btn:disabled{background:#cbd5e1;cursor:not-allowed;transform:none;box-shadow:none}
.res-bloco{margin-bottom:20px}
.res-tit{font-size:1rem;font-weight:600;margin-bottom:12px;color:var(--t)}
.barra{margin-bottom:10px}
.bar-info{display:flex;justify-content:space-between;margin-bottom:3px;font-size:.85rem}
.bar-nome{font-weight:600}
.bar-pct{font-weight:700;color:var(--p)}
.bar-fundo{height:22px;background:#e2e8f0;border-radius:11px;overflow:hidden}
.bar-fill{height:100%;border-radius:11px;background:linear-gradient(90deg,var(--p) 0%,#4a90e2 100%);transition:width 1s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:.68rem;font-weight:700;min-width:30px}
.bar-fill.lider{background:linear-gradient(90deg,var(--s) 0%,#2ecc71 100%)}
.total{text-align:center;padding:12px;background:#f8fafc;border-radius:10px;margin-top:14px;font-size:.85rem;color:var(--tl)}
.total strong{color:var(--p);font-size:1.05rem}
.erro{color:#dc2626;font-size:.82rem;margin-top:6px;display:none;align-items:center;gap:4px}
.erro.ativo{display:flex}
.info-linha{font-size:.78rem;color:var(--tl);margin-bottom:10px;font-style:italic}
.steps{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
.step{width:28px;height:28px;border-radius:50%;background:var(--b);color:var(--tl);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
.step.ativo{background:var(--p);color:#fff}
.step.done{background:var(--s);color:#fff}
@media(max-width:480px){header h1{font-size:1.2rem}.body{padding:14px}.ufs{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

function addPad(lista,prefixo){
  return [...lista,
    {id:prefixo+"_outro",nome:"Outro candidato",partido:""},
    {id:prefixo+"_indeciso",nome:"Não sei / Indeciso",partido:""},
    {id:prefixo+"_nulo",nome:"Voto nulo/branco",partido:""},
    {id:prefixo+"_nao",nome:"Não votarei",partido:""}
  ];
}
Object.keys(CONFIG.estados).forEach(uf=>{
  CONFIG.estados[uf].governador=addPad(CONFIG.estados[uf].governador,"g"+uf);
  CONFIG.estados[uf].senador=addPad(CONFIG.estados[uf].senador,"s"+uf);
});

const UFS=[
  {s:"AC",n:"Acre"},{s:"AL",n:"Alagoas"},{s:"AP",n:"Amapá"},{s:"AM",n:"Amazonas"},
  {s:"BA",n:"Bahia"},{s:"CE",n:"Ceará"},{s:"DF",n:"Distrito Federal"},{s:"ES",n:"Espírito Santo"},
  {s:"GO",n:"Goiás"},{s:"MA",n:"Maranhão"},{s:"MT",n:"Mato Grosso"},{s:"MS",n:"Mato Grosso do Sul"},
  {s:"MG",n:"Minas Gerais"},{s:"PA",n:"Pará"},{s:"PB",n:"Paraíba"},{s:"PR",n:"Paraná"},
  {s:"PE",n:"Pernambuco"},{s:"PI",n:"Piauí"},{s:"RJ",n:"Rio de Janeiro"},{s:"RN",n:"Rio Grande do Norte"},
  {s:"RS",n:"Rio Grande do Sul"},{s:"RO",n:"Rondônia"},{s:"RR",n:"Roraima"},{s:"SC",n:"Santa Catarina"},
  {s:"SP",n:"São Paulo"},{s:"SE",n:"Sergipe"},{s:"TO",n:"Tocantins"}
];

const SK='pesquisa_eleitoral_2026_v6';
let UF=null;

function getVotos(){
  try{const d=localStorage.getItem(SK);return d?JSON.parse(d):initVotos();}
  catch(e){return initVotos();}
}
function initVotos(){
  const v={pres:{},gov:{},sen:{},total:0,porUF:{}};
  CONFIG.presidente.forEach(c=>v.pres[c.id]=0);
  Object.keys(CONFIG.estados).forEach(uf=>{
    v.porUF[uf]={gov:{},sen:{}};
    CONFIG.estados[uf].governador.forEach(c=>v.porUF[uf].gov[c.id]=0);
    CONFIG.estados[uf].senador.forEach(c=>v.porUF[uf].sen[c.id]=0);
  });
  return v;
}
function salvar(v){try{localStorage.setItem(SK,JSON.stringify(v));}catch(e){}}
function jaVotou(){return localStorage.getItem(SK+'_votou')==='sim';}
function marcarVotou(){localStorage.setItem(SK+'_votou','sim');localStorage.setItem(SK+'_uf',UF);}
function getUFVotou(){return localStorage.getItem(SK+'_uf')||'';}

function renderUFs(){
  const el=document.getElementById('ufs');
  el.innerHTML=UFS.map(u=>`<button class="uf-btn" data-uf="${u.s}" onclick="selUF('${u.s}')">${u.s}<span class="uf-nome">${u.n}</span></button>`).join('');
}
function selUF(uf){
  UF=uf;
  document.querySelectorAll('.uf-btn').forEach(b=>b.classList.toggle('ativo',b.dataset.uf===uf));
  document.getElementById('errEstado').classList.remove('ativo');
}
function irPasso2(){
  if(!UF){document.getElementById('errEstado').classList.add('ativo');return;}
  document.getElementById('passo1').style.display='none';
  document.getElementById('passo2').style.display='block';
  renderVotacao();
}

function renderVotacao(){
  const d=CONFIG.estados[UF];
  const nomeUF=UFS.find(u=>u.s===UF).n;
  const el=document.getElementById('votacaoContent');
  
  el.innerHTML=`<div class="bloco">
      <div class="titulo"><span class="num">1</span> Presidente da República <span style="font-size:.78rem;color:var(--tl);font-weight:400">(${CONFIG.presidente.length} candidatos)</span></div>
      <div class="opcoes" id="opPres"></div>
      <div class="erro" id="errPres"><span>⚠️</span> Selecione uma opção.</div>
    </div>
    <div class="bloco">
      <div class="titulo"><span class="num">2</span> Governador — ${nomeUF} <span style="font-size:.78rem;color:var(--tl);font-weight:400">(${d.governador.length} candidatos)</span></div>
      <div class="opcoes" id="opGov"></div>
      <div class="erro" id="errGov"><span>⚠️</span> Selecione uma opção.</div>
    </div>
    <div class="bloco">
      <div class="titulo"><span class="num">3</span> Senador — ${nomeUF} <span style="font-size:.78rem;color:var(--tl);font-weight:400">(2 vagas • ${d.senador.length} candidatos)</span></div>
      <div class="info-linha">💡 Você pode selecionar 1 ou 2 candidatos. Na urna, são 2 votos distintos.</div>
      <div class="opcoes" id="opSen"></div>
      <div class="erro" id="errSen"><span>⚠️</span> Selecione pelo menos 1 candidato.</div>
    </div>`;
  
  renderRadio('opPres',CONFIG.presidente,'presidente');
  renderRadio('opGov',d.governador,'governador');
  renderCheck('opSen',d.senador,'senador');
}

function renderRadio(containerId,lista,name){
  const el=document.getElementById(containerId);
  el.innerHTML=lista.map(c=>`
    <label class="op-radio">
      <input type="radio" name="${name}" value="${c.id}">
      <div class="op-texto">
        <div class="op-nome">${c.nome}</div>
        ${c.partido?`<div class="op-info">${c.partido}</div>`:''}
      </div>
    </label>
  `).join('');
}

function renderCheck(containerId,lista,name){
  const el=document.getElementById(containerId);
  el.innerHTML=lista.map(c=>`
    <label class="op-check" id="chk_${c.id}">
      <input type="checkbox" name="${name}" value="${c.id}">
      <div class="op-texto">
        <div class="op-nome">${c.nome}</div>
        ${c.partido?`<div class="op-info">${c.partido}</div>`:''}
      </div>
    </label>
  `).join('');
  
  el.addEventListener('change',function(e){
    if(e.target.type!=='checkbox')return;
    const checks=el.querySelectorAll('input[type="checkbox"]:checked');
    const todos=el.querySelectorAll('input[type="checkbox"]');
    if(checks.length>=2){
      todos.forEach(c=>{if(!c.checked){c.disabled=true;c.closest('.op-check').classList.add('desabilitado');}});
    }else{
      todos.forEach(c=>{c.disabled=false;c.closest('.op-check').classList.remove('desabilitado');});
    }
  });
}

function enviarVoto(){
  const pres=document.querySelector('input[name="presidente"]:checked');
  const gov=document.querySelector('input[name="governador"]:checked');
  const sen=document.querySelectorAll('input[name="senador"]:checked');
  let ok=true;
  
  ['errPres','errGov','errSen'].forEach(id=>document.getElementById(id).classList.remove('ativo'));
  
  if(!pres){document.getElementById('errPres').classList.add('ativo');ok=false;}
  if(!gov){document.getElementById('errGov').classList.add('ativo');ok=false;}
  if(sen.length===0){document.getElementById('errSen').classList.add('ativo');ok=false;}
  
  if(!ok)return;
  
  const v=getVotos();
  v.pres[pres.value]++;
  v.porUF[UF].gov[gov.value]++;
  sen.forEach(s=>v.porUF[UF].sen[s.value]++);
  v.total++;
  salvar(v);
  marcarVotou();
  
  mostrarResultados(v);
}

function mostrarResultados(v){
  document.getElementById('passo2').style.display='none';
  document.getElementById('passo3').style.display='block';
  const el=document.getElementById('resultadosContent');
  const nomeUF=UFS.find(u=>u.s===UF).n;
  
  el.innerHTML=`<div class="res-bloco">
      <div class="res-tit">📊 Presidente da República</div>
      <div id="resPres"></div>
    </div>
    <div class="res-bloco">
      <div class="res-tit">📊 Governador — ${nomeUF}</div>
      <div id="resGov"></div>
    </div>
    <div class="res-bloco">
      <div class="res-tit">📊 Senador — ${nomeUF}</div>
      <div id="resSen"></div>
    </div>
    <div class="total">Total de participantes: <strong>${v.total.toLocaleString('pt-BR')}</strong> pessoas</div>`;
  
  renderBarras('resPres',v.pres,CONFIG.presidente,v.total);
  renderBarras('resGov',v.porUF[UF].gov,CONFIG.estados[UF].governador);
  renderBarras('resSen',v.porUF[UF].sen,CONFIG.estados[UF].senador);
}

function renderBarras(containerId,dadosVotos,candidatos,totalGeral){
  const el=document.getElementById(containerId);
  const total=totalGeral!==undefined?totalGeral:Object.values(dadosVotos).reduce((a,b)=>a+b,0);
  const sorted=candidatos.map(c=>({...c,votos:dadosVotos[c.id]||0})).sort((a,b)=>b.votos-a.votos);
  const maxV=sorted[0]?.votos||1;
  
  el.innerHTML=sorted.map((c,i)=>{
    const pct=total>0?((c.votos/total)*100).toFixed(1):'0.0';
    const w=maxV>0?((c.votos/maxV)*100):0;
    const lider=i===0&&c.votos>0;
    return `<div class="barra">
        <div class="bar-info"><span class="bar-nome">${c.nome}</span><span class="bar-pct">${pct}% (${c.votos} voto${c.votos!==1?'s':''})</span></div>
        <div class="bar-fundo"><div class="bar-fill ${lider?'lider':''}" style="width:0%" data-w="${w}%">${w>12?pct+'%':''}</div></div>
      </div>`;
  }).join('');
  
  setTimeout(()=>{el.querySelectorAll('.bar-fill').forEach(b=>b.style.width=b.dataset.w);},100);
}

document.addEventListener('DOMContentLoaded',()=>{
  renderUFs();
  if(jaVotou()){
    const ufSalva=getUFVotou();
    if(ufSalva&&CONFIG.estados[ufSalva]){
      UF=ufSalva;
      document.getElementById('passo1').style.display='none';
      document.getElementById('passo3').style.display='block';
      mostrarResultados(getVotos());
    }
  }
});
</script>
