<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voto Consciente</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#1a5f2a 0%,#0d3b1a 100%);min-height:100vh;color:#fff}
.container{max-width:500px;margin:0 auto;padding:20px}
header{text-align:center;padding:30px 0}
header h1{font-size:2rem;margin-bottom:10px;text-shadow:2px 2px 4px rgba(0,0,0,0.3)}
.card{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:20px;padding:25px;margin-bottom:20px;border:1px solid rgba(255,255,255,0.2)}
.card h2{font-size:1.3rem;margin-bottom:15px;color:#a8e6cf}
.btn{display:block;width:100%;padding:15px;background:#ffd700;color:#0d3b1a;border:none;border-radius:12px;font-size:1.1rem;font-weight:bold;cursor:pointer;margin-top:15px}
.checklist-item{display:flex;align-items:flex-start;margin-bottom:15px}
.checklist-item input{width:22px;height:22px;margin-right:12px;margin-top:2px;accent-color:#ffd700}
.progress-bar{width:100%;height:10px;background:rgba(255,255,255,0.2);border-radius:5px;margin-top:15px;overflow:hidden}
.progress-fill{height:100%;background:#ffd700;border-radius:5px;transition:width 0.5s;width:0%}
.progress-text{text-align:center;margin-top:10px;font-size:0.9rem;font-weight:bold}
footer{text-align:center;padding:20px;font-size:0.8rem;opacity:0.7}
.icon{font-size:2.5rem;text-align:center;margin-bottom:10px}
</style>
</head>
<body>
<div class="container">
<header><div class="icon">🗳️</div><h1>Voto Consciente</h1><p>Informação é poder. Vote com consciência!</p></header>
<div class="card"><h2>📋 Checklist do Eleitor Consciente</h2>
<div class="checklist-item"><input type="checkbox" id="i1" onchange="up()"><label for="i1">Consultei a ficha limpa do candidato</label></div>
<div class="checklist-item"><input type="checkbox" id="i2" onchange="up()"><label for="i2">Li o plano de governo/propostas</label></div>
<div class="checklist-item"><input type="checkbox" id="i3" onchange="up()"><label for="i3">Verifiquei o histórico de mandatos
